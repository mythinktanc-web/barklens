media:
  - name: blog_images
    label: Blog images
    input: marketing-site/public/images/blog
    output: /images/blog
    extensions: [jpg, jpeg, png, webp]
    categories: [image]
    rename: safe

content:
  - name: blog
    label: Blog articles
    type: collection
    path: marketing-site/src/content/blog
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, draft, category, publishDate, author]
      sort: publishDate
      order: desc
      search: [title, description, author, category, tags]
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: description
        label: Short description
        type: text
        required: true
        description: One clear sentence used on the Blog page and in page metadata.
      - name: publishDate
        label: Publish date
        type: date
        required: true
      - name: updatedDate
        label: Updated date
        type: date
      - name: author
        label: Author
        type: string
        required: true
        default: Ben Singer
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Labs and Reports
            - Medications and Labels
            - Food and Nutrition
            - Conditions
            - Veterinary Visit Preparation
      - name: tags
        label: Tags
        type: string
        list: true
      - name: coverImage
        label: Cover image
        type: image
        required: true
        options:
          media: blog_images
      - name: coverAlt
        label: Cover image description
        type: string
        required: true
        description: Describe the scene. Do not state that a pictured dog has a condition.
      - name: draft
        label: Keep as draft
        type: boolean
        default: true
      - name: sourcesVerified
        label: Source links checked
        type: boolean
        default: false
        description: Required before publishing. Confirm every source opens and supports the nearby sentence.
      - name: veterinaryReviewer
        label: Veterinary reviewer
        type: string
        description: Leave blank unless a veterinarian reviewed this specific article.
      - name: sources
        label: Sources
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{fields.label}"
        fields:
          - name: label
            label: Source name
            type: string
            required: true
          - name: url
            label: Source URL
            type: string
            required: true
            pattern: "^https://"
          - name: note
            label: What this source supports
            type: text
            required: true
      - name: body
        label: Article body
        type: rich-text
        required: true
        options:
          format: markdown
          media: blog_images
          rename: safe
          switcher: true

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content(blog): create {filename}"
      update: "content(blog): update {filename}"
      delete: "content(blog): remove {filename}"
